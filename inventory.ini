# ============================================
# ops-relay Ansible 动态清单
# 挂载进容器为 /etc/ansible/hosts
# OS 类型由此决定（与 config.yml 分组保持一致）
# ============================================

[all_linux]
10.0.0.5    ansible_user=root
10.0.0.7    ansible_user=root
10.0.0.9    ansible_user=root
10.0.0.15   ansible_user=root
10.0.0.18   ansible_user=root
10.0.0.198  ansible_user=root
10.0.0.199  ansible_user=root
10.0.0.6    ansible_user=root
# 65 是 CentOS 6.8，用户 ciniao（非 root）；只认 rsa（见下 all:vars）
10.0.0.65   ansible_user=ciniao

# Windows 主机：走 WinRM(5985)，断电重启后也稳（WinRM 服务默认自启）
# transport=ntlm 对本地账户开箱即用（服务端默认允许），无需改 Windows 配置。
# 密码不写这里（不入 git），放在 host_vars/<ip>.yml（gitignore，挂载进容器，Ansible 自动加载）。
[windows]
10.0.0.10   ansible_connection=winrm ansible_user=administrator ansible_winrm_transport=ntlm ansible_winrm_scheme=http ansible_winrm_server_cert_validation=ignore ansible_port=5985
10.0.0.253  ansible_connection=winrm ansible_user=administrator ansible_winrm_transport=ntlm ansible_winrm_scheme=http ansible_winrm_server_cert_validation=ignore ansible_port=5985
10.0.0.254  ansible_connection=winrm ansible_user=administrator ansible_winrm_transport=ntlm ansible_winrm_scheme=http ansible_winrm_server_cert_validation=ignore ansible_port=5985

[all:vars]
# 容器用 15 的 /root/.ssh/id_rsa 免密连 Linux（公钥已分发到各机 authorized_keys）
ansible_ssh_private_key_file=/root/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
