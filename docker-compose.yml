# ============================================
# ops-relay Docker Compose 编排文件
# 开发环境：后端 API + 前端 + 数据持久化
# ============================================

services:
  # ==================== 后端 API 服务 ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ops-relay-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data/db:/app/data
      - ~/.ssh:/root/.ssh:ro
      - ./inventory.ini:/etc/ansible/hosts:ro
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==================== 前端 Web 服务 ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ops-relay-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    networks:
      - ops-network

networks:
  ops-network:
    driver: bridge
