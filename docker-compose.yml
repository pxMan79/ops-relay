# ============================================
# ops-relay 单容器编排（IP+端口直连模式）
# 单个 ops-relay 容器：FastAPI 同时托管前端 SPA + /api。
# 访问方式：http://<本机IP>:8001 （主机端口直连，不经 NPM）
# NPM 留作以后做主页 / 上 HTTPS 用，本项目不走它，故不接任何外部网络。
# ============================================

services:
  ops-relay:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: shabox/ops-relay:latest
    container_name: ops-relay
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data/db:/app/data
      - ~/.ssh:/root/.ssh:ro
      - ${ANSIBLE_INVENTORY_PATH:-./inventory.ini}:/etc/ansible/hosts:ro
      - ./host_vars:/etc/ansible/host_vars:ro
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - STATIC_DIR=/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
