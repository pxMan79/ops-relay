# ============================================
# ops-relay 自动部署（单容器，IP+端口直连）
# push 到 main → 在自托管 runner 上构建并启动 ops-relay 单容器
# 访问 http://<host>:8001，不经 NPM
# ============================================

name: Deploy ops-relay

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: aurora
    if: github.actor == 'pxMan79'
    steps:
      - name: Pull latest code
        run: |
          set -e
          cd /opt/ops-relay
          git fetch --all
          git reset --hard origin/main

      - name: Remove legacy frontend/backend containers
        run: |
          # 旧版是 frontend+backend 双容器，改为单体后需先清掉，避免抢 8001 端口
          docker rm -f ops-relay-backend ops-relay-frontend ops-relay-backend-prod ops-relay-frontend-prod 2>/dev/null || true

      - name: Build and start ops-relay (single container)
        run: |
          cd /opt/ops-relay
          docker compose -f docker-compose.yml up -d --build

      - name: Verify deployment
        run: |
          echo "等待健康检查..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "✅ ops-relay 就绪"
              break
            fi
            echo "等待中... ($i/30)"
            sleep 5
          done
          echo "=== 容器状态 ==="
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep ops-relay
          echo "=== 健康检查 ==="
          curl -sf http://localhost:8001/health || echo "❌ backend 不健康"
